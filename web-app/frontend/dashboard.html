<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acoustic Level Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style-dashboard.css">

</head>
<body>
  <!-- <a href="index.html">← Back</a> -->

  <div class="container">

    <header>
      <h1></h1>
      <p class="subtitle">Realtime Sound Pressure Level</p>
    </header>

      <main class="dashboard">

        <!-- SPL utama -->
        <div class="spl-main">
          <div class="spl-value">
            <span id="spl">--</span>
            <span class="unit">dBA</span>
          </div>
          <div class="spl-label">CURRENT LEVEL</div>
        </div>
      
        <!-- Statistik -->
        <div class="stats">
      
          <div class="stat">
            <div class="stat-value" id="min">--</div>
            <div class="stat-label">MIN</div>
          </div>
      
          <div class="stat">
            <div class="stat-value" id="avg">--</div>
            <div class="stat-label">AVG</div>
          </div>
      
          <div class="stat">
            <div class="stat-value" id="max">--</div>
            <div class="stat-label">MAX</div>
          </div>
      
        </div>
      
        <!-- Chart -->
        <div class="chart-card">
          <div class="label">Noise Trend (Last 30s)</div>
          <canvas id="splChart"></canvas>
        </div>
      
      </main>
  

    <footer>
      <span id="status">STATUS: —</span>
    </footer>

  </div>

  <!-- JS -->
  <!-- jangan pakai versi .min.js -->
  <script src="https://unpkg.com/paho-mqtt@1.0.3/mqttws31.js"></script>
  <!-- <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
